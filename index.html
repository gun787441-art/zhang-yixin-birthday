
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#120b2e">
<title>张艺欣 · 生日快乐 🎂</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system,BlinkMacSystemFont,
  "PingFang SC","Microsoft YaHei",sans-serif;
  color: #fff;
  background: #090616;
}

.page {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,105,180,.25),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(95,70,255,.25),transparent 35%),
    linear-gradient(145deg,#090616,#17103b 55%,#0b1835);
  isolation: isolate;
}

/* 梦幻极光 */
.page::before {
  content: "";
  position: absolute;
  inset: -50%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 30% 35%,rgba(255,80,180,.25),transparent 40%),
    radial-gradient(ellipse at 70% 60%,rgba(100,80,255,.3),transparent 42%);
  filter: blur(40px);
  animation: aurora 12s ease-in-out infinite alternate;
}

@keyframes aurora {
  from { transform: translate(-4%,-3%) rotate(0deg) scale(1); }
  to { transform: translate(4%,5%) rotate(10deg) scale(1.15); }
}

/* 星空 */
.stars,.stars:before,.stars:after {
  position: absolute;
  inset: 0;
  content: "";
  pointer-events: none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.85) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,220,150,.7) 0 1px,transparent 1.5px);
  background-size: 83px 97px,131px 149px;
  background-position: 10px 20px,40px 70px;
  animation: twinkle 4s ease-in-out infinite alternate;
}

.stars:before {
  opacity: .45;
  transform: scale(1.3);
  animation-duration: 6s;
}

.stars:after {
  opacity: .25;
  transform: scale(.8);
  animation-duration: 3s;
}

@keyframes twinkle {
  from { opacity: .25; }
  to { opacity: .9; }
}

/* 主卡片 */
.card {
  position: relative;
  z-index: 3;
  width: min(90%,520px);
  padding: 38px 24px 34px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 30px;
  background: rgba(255,255,255,.09);
  box-shadow:
    0 20px 80px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.16);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: cardEnter 1.4s ease both,cardGlow 4s ease-in-out 1.4s infinite alternate;
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.88);
    filter: blur(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes cardGlow {
  from {
    box-shadow: 0 20px 80px rgba(0,0,0,.4),0 0 15px rgba(255,120,190,.1);
  }
  to {
    box-shadow: 0 20px 80px rgba(0,0,0,.4),0 0 40px rgba(255,120,210,.35);
  }
}

.badge {
  display: inline-block;
  padding: 7px 13px;
  border-radius: 999px;
  background: rgba(255,215,110,.13);
  border: 1px solid rgba(255,215,110,.35);
  color: #ffe59b;
  font-size: 13px;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: clamp(38px,11vw,64px);
  line-height: 1.08;
  letter-spacing: 2px;
  font-weight: 900;
  background: linear-gradient(90deg,#fff,#ffd86e,#ff9fbe,#fff);
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 4s linear infinite;
  filter: drop-shadow(0 0 15px rgba(255,150,210,.5));
}

@keyframes shine {
  to { background-position: 300% center; }
}

.name {
  font-size: clamp(28px,8vw,42px);
  font-weight: 800;
  margin: 8px 0 20px;
  color: #fff;
}

.message {
  font-size: 17px;
  line-height: 1.9;
  color: rgba(255,255,255,.9);
  margin: 0 auto;
  max-width: 390px;
}

.highlight {
  color: #ffd86e;
  font-weight: 800;
}

.cake {
  font-size: 78px;
  line-height: 1;
  margin: 18px 0 12px;
  filter: drop-shadow(0 8px 20px rgba(255,180,80,.3));
  animation: bounce 1.8s ease-in-out infinite;
}

@keyframes bounce {
  50% { transform: translateY(-8px) scale(1.04); }
}

.hint {
  margin-top: 24px;
  padding: 13px 16px;
  border-radius: 16px;
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 14px;
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  50% { box-shadow: 0 0 0 8px rgba(255,255,255,.03); }
}

/* 气球 */
.balloon {
  position: absolute;
  z-index: 1;
  font-size: 48px;
  animation: float 6s ease-in-out infinite;
  pointer-events: none;
}

.b1 { left:4%;top:12%;animation-delay:-1s; }
.b2 { right:5%;top:18%;animation-delay:-3s; }
.b3 { left:7%;bottom:13%;animation-delay:-2s; }
.b4 { right:7%;bottom:10%;animation-delay:-4s; }

@keyframes float {
  0%,100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-28px) rotate(5deg); }
}

/* 普通彩带 */
.confetti {
  position: absolute;
  z-index: 5;
  width: 9px;
  height: 15px;
  top: -30px;
  border-radius: 2px;
  animation: fall 3.5s linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

/* 开场 */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(5,2,15,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px;
  transition: opacity .45s,visibility .45s;
}

.overlay.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.start {
  width: min(88%,420px);
  padding: 34px 25px;
  border-radius: 28px;
  background: linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.06));
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 20px 70px rgba(0,0,0,.45);
}

.start .big { font-size: 62px; }
.start h2 { margin: 10px 0;font-size: 27px; }
.start p {
  color: rgba(255,255,255,.75);
  line-height: 1.7;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 15px 30px;
  margin-top: 10px;
  color: #241300;
  font-weight: 900;
  font-size: 17px;
  background: linear-gradient(90deg,#ffd86e,#ff9fbe);
  box-shadow: 0 10px 30px rgba(255,170,120,.25);
  cursor: pointer;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  z-index: 30;
  padding: 11px 17px;
  border-radius: 999px;
  background: rgba(0,0,0,.75);
  color: #fff;
  font-size: 13px;
  opacity: 0;
  transition: .3s;
  white-space: nowrap;
  pointer-events: none;
}

.toast.show { opacity: 1; }

.music-btn {
  position: absolute;
  right: 16px;
  top: 16px;
  z-index: 10;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.1);
  color: #fff;
  font-size: 18px;
}

/* ===== 烟花粒子 ===== */
.firework {
  position: absolute;
  z-index: 15;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform,opacity;
  box-shadow: 0 0 8px currentColor,0 0 18px currentColor;
  animation: fireworkMove var(--duration) cubic-bezier(.1,.5,.3,1) forwards;
}

@keyframes fireworkMove {
  0% {
    opacity: 1;
    transform: translate(0,0) scale(1.3);
  }
  70% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate(var(--dx),var(--dy)) scale(0);
  }
}

/* 烟花中心闪光 */
.flash {
  position: absolute;
  z-index: 14;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  pointer-events: none;
  background: white;
  box-shadow: 0 0 20px 10px #fff,0 0 50px 20px #ff8ac8;
  animation: flashOut .6s ease-out forwards;
}

@keyframes flashOut {
  from { opacity: 1;transform: scale(.3); }
  to { opacity: 0;transform: scale(5); }
}

/* 烟花文字 */
.firework-text {
  position: absolute;
  z-index: 16;
  pointer-events: none;
  font-size: 23px;
  font-weight: 900;
  color: #ffe59b;
  text-shadow: 0 0 12px #ff70b8,0 0 25px #ff70b8;
  animation: textPop 1.5s ease-out forwards;
  white-space: nowrap;
}

@keyframes textPop {
  0% { opacity: 0;transform: translate(-50%,-50%) scale(.2); }
  25% { opacity: 1;transform: translate(-50%,-50%) scale(1.2); }
  100% { opacity: 0;transform: translate(-50%,-130%) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .page::before,.card,.cake,.stars,.balloon {
    animation: none !important;
  }
}
</style>
</head>

<body>

<div class="page" id="page">

  <div class="stars"></div>

  <div class="balloon b1">🎈</div>
  <div class="balloon b2">🎈</div>
  <div class="balloon b3">🎈</div>
  <div class="balloon b4">🎈</div>

  <button class="music-btn" id="musicBtn">🔇</button>

  <main class="card">

    <div class="badge">TODAY IS YOUR DAY ✨</div>

    <h1>💕张艺欣💕</h1>

    <div class="name">生日快乐，我的宝贝！🎉</div>

    <div class="cake">🎂</div>

    <p class="message">
      愿你新的一岁<br>
      <span class="highlight">有钱、有闲、有快乐</span><br>
      想吃就吃，想玩就玩，想干啥就干啥！<br>
      愿所有好运都准时到账，<br>
      愿你的每一天都有阳光和惊喜，<br>
      <b>
        媳妇儿，生日快乐！<br>
        愿我一直陪着你，爱着你 ❤️
      </b>
    </p>

    <div class="hint" id="hint">
      点击屏幕，绽放专属生日烟花 🎆
    </div>

  </main>

  <div class="overlay" id="overlay">
    <div class="start">
      <div class="big">🎂💗</div>
      <h2>张艺欣，准备好了吗？</h2>
      <p>
        今天你是全世界最幸福的小公主。<br>
        老公为你准备了一份专属生日惊喜！
      </p>
      <button id="startBtn">🎉 开始生日惊喜</button>
      <p style="margin-top:18px;font-size:12px;opacity:.55">
        点击开始，即可欣赏专属生日烟花秀。
      </p>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<audio id="song" src="生日祝福歌 - 格格.mp3" loop preload="auto"></audio>

<script>
const page = document.getElementById('page');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const musicBtn = document.getElementById('musicBtn');
const hint = document.getElementById('hint');
const toast = document.getElementById('toast');
const audio = document.getElementById('song');

let musicOn = false;
let started = false;
let ctx = null;

// ===== 提示 =====
function showToast(t) {
  toast.textContent = t;
  toast.classList.add('show');

  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    toast.classList.remove('show');
  },2200);
}

// ===== 音乐 =====
async function startMusic() {
  try {
    await audio.play();
    musicOn = true;
    musicBtn.textContent = '🎵';
  } catch(e) {
    showToast('请确认生日音乐文件存在 ❤️');
  }
}

function stopMusic() {
  audio.pause();
  audio.currentTime = 0;
  musicOn = false;
  musicBtn.textContent = '🔇';
}

musicBtn.addEventListener('click', async e => {
  e.stopPropagation();

  if (!started) return;

  if (musicOn) {
    stopMusic();
  } else {
    await startMusic();
  }
});

// ===== 彩带 =====
function confetti(n = 70) {
  for(let i = 0; i < n; i++) {
    const c = document.createElement('i');

    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDelay = Math.random() * 1.5 + 's';

    c.style.background = [
      '#ffd86e','#ff7aa8','#8ee8ff',
      '#b6ff9e','#c5a7ff'
    ][Math.floor(Math.random() * 5)];

    c.style.width = (6 + Math.random() * 7) + 'px';
    c.style.height = (9 + Math.random() * 10) + 'px';

    page.appendChild(c);

    setTimeout(() => c.remove(),5200);
  }
}

// ===== 核心烟花效果 =====
function createFirework(x,y,scale = 1) {

  const colors = [
    '#ff4f9a',
    '#ffd86e',
    '#ffffff',
    '#a88bff',
    '#65e5ff',
    '#ff8c42',
    '#ffb7df',
    '#8effbd'
  ];

  // 随机烟花颜色
  const color = colors[
    Math.floor(Math.random() * colors.length)
  ];

  // 中心闪光
  const flash = document.createElement('div');
  flash.className = 'flash';

  flash.style.left = x + 'px';
  flash.style.top = y + 'px';

  page.appendChild(flash);

  setTimeout(() => flash.remove(),650);

  // 第一层：圆形爆炸
  const count = Math.floor(65 * scale);

  for(let i = 0; i < count; i++) {

    const angle = Math.PI * 2 * i / count;

    const distance = (65 + Math.random() * 105) * scale;

    const particle = document.createElement('i');

    particle.className = 'firework';

    particle.style.left = x + 'px';
    particle.style.top = y + 'px';

    particle.style.color = color;
    particle.style.background = color;

    particle.style.width = (3 + Math.random() * 4) + 'px';
    particle.style.height = particle.style.width;

    particle.style.setProperty(
      '--dx',
      Math.cos(angle) * distance + 'px'
    );

    particle.style.setProperty(
      '--dy',
      Math.sin(angle) * distance + 'px'
    );

    particle.style.setProperty(
      '--duration',
      (0.8 + Math.random() * 0.9) + 's'
    );

    page.appendChild(particle);

    setTimeout(() => particle.remove(),1900);
  }

  // 第二层：额外星光
  for(let i = 0; i < 18; i++) {

    const angle = Math.random() * Math.PI * 2;
    const distance = Math.random() * 130 * scale;

    const star = document.createElement('i');

    star.className = 'firework';

    star.style.left = x + 'px';
    star.style.top = y + 'px';

    star.style.background = '#fff';
    star.style.color = '#fff';

    star.style.width = '3px';
    star.style.height = '3px';

    star.style.setProperty(
      '--dx',
      Math.cos(angle) * distance + 'px'
    );

    star.style.setProperty(
      '--dy',
      Math.sin(angle) * distance + 'px'
    );

    star.style.setProperty('--duration','1.4s');

    page.appendChild(star);

    setTimeout(() => star.remove(),1500);
  }

  // 中心爱心
  const heart = document.createElement('div');

  heart.className = 'firework-text';
  heart.textContent = '💗';

  heart.style.left = x + 'px';
  heart.style.top = y + 'px';

  page.appendChild(heart);

  setTimeout(() => heart.remove(),1600);
}

// ===== 生日祝福烟花 =====
function birthdayFirework(x,y) {

  createFirework(x,y,1.1);

  setTimeout(() => {
    createFirework(
      x - 65,
      y - 65,
      .75
    );
  },220);

  setTimeout(() => {
    createFirework(
      x + 65,
      y - 75,
      .8
    );
  },420);
}

// ===== 开场烟花秀 =====
function openingFireworks() {

  const w = page.clientWidth;
  const h = page.clientHeight;

  birthdayFirework(w * .5,h * .27);

  setTimeout(() => {
    birthdayFirework(w * .25,h * .38);
  },500);

  setTimeout(() => {
    birthdayFirework(w * .75,h * .38);
  },1000);

  setTimeout(() => {
    birthdayFirework(w * .5,h * .55);
  },1500);

  setTimeout(() => {
    birthdayFirework(w * .35,h * .25);
  },2000);
}

// ===== 点击屏幕放烟花 =====
page.addEventListener('pointerdown',e => {

  if(!started) return;

  if(e.target.closest('#musicBtn')) return;

  const rect = page.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  birthdayFirework(x,y);

  // 随机祝福
  const lines = [
    '媳妇儿，愿你永远幸福！❤️',
    '张艺欣，天天开心！🌹',
    '以后的生日我都陪你过！💑',
    '想要的都拥有！✨',
    '今天你最大，老公负责宠你！👑',
    '余生请多指教，我会一直爱你！❤️'
  ];

  showToast(
    lines[Math.floor(Math.random() * lines.length)]
  );
});

// ===== 开始生日惊喜 =====
startBtn.addEventListener('click',async e => {

  e.stopPropagation();

  started = true;

  overlay.classList.add('hide');

  confetti(120);

  hint.textContent = '🎆 点击屏幕，收获专属浪漫烟花！💗';

  // 自动播放开场烟花秀
  openingFireworks();

  // 播放生日音乐
  await startMusic();

  showToast('生日快乐，我最爱的张艺欣！❤️');
});

</script>

</body>
</html>
